<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="vmGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="vmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(241, 196, 15, 0.25)" stroke-width="4"/>

  <!-- Glow effect -->
  <g filter="url(#vmGlow)">
    <rect x="96" y="96" width="320" height="320" rx="36" fill="url(#vmGoldGrad)" />
  </g>

  <!-- Main Vector Magic Emblem -->
  <g stroke="#475569" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="96" y="96" width="320" height="320" rx="36" fill="url(#vmGoldGrad)" stroke="#64748b" />
    <circle cx="256" cy="256" r="100" fill="none" stroke="#ffffff" stroke-width="24"/>
    <circle cx="256" cy="256" r="32" fill="#ffffff" stroke="#ffffff" stroke-width="8"/>
    <rect x="256" y="256" width="160" height="160" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="12"/>
    <line x1="256" y1="416" x2="416" y2="256" stroke="#64748b" stroke-width="14"/>
  </g>
</svg>
