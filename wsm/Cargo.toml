[package]
name = "wsm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly heavy-duty image vectorization acceleration engine for Vector Magic"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
visioncortex = "0.9.3"
vtracer = "1.0.0-alpha.4"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
